name: AI Security Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:
    
permissions:
  contents: write
jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Project Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bandit Scan
        run: |
          mkdir -p reports
          bandit -r app/ -f json -o reports/bandit-report.json || true

      - name: Run AI Analyzer
        run: python scanner/ai_analyzer.py

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
         name: ai-security-report
         path: reports/final-report.json
      - name: Commit latest reports
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add reports/bandit-report.json
          git add reports/final-report.json

          git commit -m "Auto update security reports" || echo "No changes"

          git push